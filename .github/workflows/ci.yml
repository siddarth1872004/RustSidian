# NOTE: written on a machine without access to GitHub Actions; this workflow has not been run.
name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p rustsidian
      - name: Performance budgets (exits non-zero when a budget is missed)
        shell: bash
        run: cargo run --release -p rustsidian --example perf_budget -- --dir "$RUNNER_TEMP/perf-vaults" --sizes 1000,10000,50000
      - name: Binary size gate (15 MB)
        shell: bash
        run: |
          bin=target/release/rustsidian
          [ -f "$bin.exe" ] && bin="$bin.exe"
          size=$(wc -c < "$bin")
          echo "$bin: $size bytes"
          test "$size" -le 15728640

  extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: Property tests with more cases
        run: cargo test --release -p md-engine -p vault-core -p editor-core -p theme-engine
        env:
          PROPTEST_CASES: 20000
      - name: Window budgets under a virtual display (cold start, idle RAM, idle CPU)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          cargo build --release -p rustsidian
          cargo run --release -p rustsidian --example perf_budget -- --dir "$RUNNER_TEMP/v" --sizes 5000,10000,50000 --report-only
          xvfb-run -a scripts/window-budget.sh "$RUNNER_TEMP/v"
