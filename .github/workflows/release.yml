# NOTE: written on a machine without access to GitHub Actions; this workflow has not been run.
name: release
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, ext: zip }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64, ext: tar.gz }
          - { os: macos-13, target: x86_64-apple-darwin, name: macos-x86_64, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release -p walnut --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          dir="walnut-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dir"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/walnut.exe" "$dir/"
            7z a "$dir.zip" "$dir"
          else
            cp "target/${{ matrix.target }}/release/walnut" "$dir/"
            strip "$dir/walnut" || true
            if [ "${{ runner.os }}" = "Linux" ]; then
              cp packaging/walnut.desktop packaging/walnut.svg "$dir/"
            fi
            tar czf "$dir.tar.gz" "$dir"
          fi
          echo "ASSET=$dir.${{ matrix.ext }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
