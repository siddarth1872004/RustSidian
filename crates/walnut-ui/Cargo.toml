[package]
name = "walnut-ui"
description = "Retained UI toolkit: CSS-styled element tree, taffy layout, display list, software renderer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
theme-engine = { path = "../theme-engine" }
rayon = "1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash", "fontconfig"] }
