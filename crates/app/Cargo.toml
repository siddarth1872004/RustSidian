[package]
name = "walnut"
description = "Rustwalnut: an Obsidian-compatible knowledge base"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "walnut_app"
path = "src/lib.rs"

[[bin]]
name = "walnut"
path = "src/main.rs"

[features]
default = ["window"]
window = ["dep:winit", "dep:softbuffer"]

[dependencies]
md-engine = { path = "../md-engine" }
vault-core = { path = "../vault-core" }
search-core = { path = "../search-core" }
graph-core = { path = "../graph-core" }
canvas-core = { path = "../canvas-core" }
editor-core = { path = "../editor-core" }
highlight-core = { path = "../highlight-core" }
math-core = { path = "../math-core" }
mermaid-core = { path = "../mermaid-core" }
theme-engine = { path = "../theme-engine" }
walnut-ui = { path = "../walnut-ui" }
serde_json = { version = "1", features = ["preserve_order"] }
winit = { version = "0.30", optional = true, default-features = false, features = ["x11", "wayland", "wayland-dlopen", "rwh_06"] }
softbuffer = { version = "0.4", optional = true, default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }

[dev-dependencies]
tempfile = "3"
